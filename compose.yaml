services:
  wirewatch:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - archive:/data
      - codex:/home/node/.codex
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  archive:
  codex:
